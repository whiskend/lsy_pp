<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="이승연의 영상 포트폴리오. 서울예술대학교 재학."
    />
    <meta name="theme-color" content="#101010" />
    <title>이승연 — Film & Music Video</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='2' fill='%23101010'/%3E%3Cpath d='M7 6v20h18v-4H11V6z' fill='%23f2f2ee'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#work">작품으로 건너뛰기</a>
    <div class="page">
      <header class="header">
        <!-- 이름과 소개는 임시 정보입니다. 연락처 확인 후 실제 링크를 추가하세요. -->
        <a class="wordmark" href="./" aria-label="이승연 포트폴리오 홈"
          >이승연<span class="wordmark-caption">FILM & MUSIC VIDEO</span></a
        >
        <nav aria-label="메인 메뉴">
          <a href="#work">Work</a>
          <a href="#about">About</a>
        </nav>
      </header>
      <main>
        <section id="work" class="work" aria-labelledby="work-heading">
          <div class="section-bar">
            <h1 id="work-heading">Selected work</h1>
            <span class="work-count">01 / 01</span>
          </div>
          <a
            class="project-link"
            href="https://www.youtube.com/watch?v=UO7nAK1CInE"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="각질 전체 영상을 YouTube에서 보기 — 새 탭에서 열림"
          >
            <figure class="project">
              <div class="project-media">
                <img
                  id="film-preview"
                  class="project-image"
                  src="assets/gakjil-poster.jpg"
                  data-motion-src="assets/gakjil-preview.gif"
                  data-still-src="assets/gakjil-poster.jpg"
                  alt="단편영화 각질 — 야외에 나란히 있는 두 인물의 장면"
                  width="1280"
                  height="552"
                  fetchpriority="high"
                />
                <span class="play-label"
                  ><span class="play-triangle" aria-hidden="true"></span>Watch
                  film<span class="external-arrow" aria-hidden="true"
                    >↗</span
                  ></span
                >
                <span class="frame-label" aria-hidden="true"
                  >A FILM BY 이승연</span
                >
              </div>
              <figcaption class="project-caption">
                <div class="project-title">
                  <h2>각질</h2>
                  <span class="project-genre">SHORT FILM</span>
                </div>
                <div class="project-details">
                  <span>2026</span><span>14′ 26″</span
                  ><span class="youtube-link"
                    >YouTube <span aria-hidden="true">↗</span></span
                  >
                </div>
              </figcaption>
            </figure>
          </a>
          <button
            class="motion-toggle"
            type="button"
            aria-controls="film-preview"
            hidden
          >
            <span class="motion-icon" aria-hidden="true">▷</span
            ><span class="motion-text">미리보기 재생</span>
          </button>
        </section>
        <section id="about" class="about" aria-labelledby="about-heading">
          <h2 id="about-heading">About</h2>
          <div class="about-copy">
            <p class="name">이승연</p>
            <p class="education">서울예술대학교 재학</p>
          </div>
          <span class="discipline">FILM<br />MUSIC VIDEO</span>
        </section>
      </main>
      <footer>
        <span>© <span id="year">2026</span> 이승연</span
        ><a href="#work">Back to work <span aria-hidden="true">↑</span></a>
      </footer>
    </div>
  </body>
</html>
